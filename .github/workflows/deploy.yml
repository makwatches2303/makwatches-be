name: Deploy MakWatches Backend to AWS Lambda

on:
  push:
    branches:
      - main
      - admin-features
  workflow_dispatch:

concurrency:
  group: deploy-makwatches-be
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to AWS Lambda
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Prepare Environment File
        env:
          ENV_FILE_SECRET: ${{ secrets.ENV_FILE }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL || 'https://makwatches.in' }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS || 'https://makwatches.in,https://admin.makwatches.in' }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_MODE: ${{ secrets.RAZORPAY_MODE || 'live' }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_BUCKET_NAME: ${{ secrets.FIREBASE_BUCKET_NAME }}
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
          DELHIVERY_API_TOKEN: ${{ secrets.DELHIVERY_API_TOKEN }}
          DELHIVERY_BASE_URL: ${{ secrets.DELHIVERY_BASE_URL }}
          DELHIVERY_PICKUP_LOCATION: ${{ secrets.DELHIVERY_PICKUP_LOCATION }}
          DELHIVERY_SELLER_NAME: ${{ secrets.DELHIVERY_SELLER_NAME }}
          DELHIVERY_SELLER_PHONE: ${{ secrets.DELHIVERY_SELLER_PHONE }}
          DELHIVERY_SELLER_ADDRESS: ${{ secrets.DELHIVERY_SELLER_ADDRESS }}
          DELHIVERY_SELLER_CITY: ${{ secrets.DELHIVERY_SELLER_CITY }}
          DELHIVERY_SELLER_STATE: ${{ secrets.DELHIVERY_SELLER_STATE }}
          DELHIVERY_SELLER_PINCODE: ${{ secrets.DELHIVERY_SELLER_PINCODE }}
          DELHIVERY_RETURN_ADDRESS: ${{ secrets.DELHIVERY_RETURN_ADDRESS }}
          DELHIVERY_RETURN_CITY: ${{ secrets.DELHIVERY_RETURN_CITY }}
          DELHIVERY_RETURN_STATE: ${{ secrets.DELHIVERY_RETURN_STATE }}
          DELHIVERY_RETURN_PINCODE: ${{ secrets.DELHIVERY_RETURN_PINCODE }}
          DELHIVERY_RETURN_PHONE: ${{ secrets.DELHIVERY_RETURN_PHONE }}
          FLOWSELL_API_KEY: ${{ secrets.FLOWSELL_API_KEY }}
          FLOWSELL_API_BASE_URL: ${{ secrets.FLOWSELL_API_BASE_URL }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_WELCOME_TEMPLATE: ${{ secrets.WHATSAPP_WELCOME_TEMPLATE }}
          WHATSAPP_CART_TEMPLATE: ${{ secrets.WHATSAPP_CART_TEMPLATE }}
          WHATSAPP_WELCOME_IMAGE_URL: ${{ secrets.WHATSAPP_WELCOME_IMAGE_URL }}
          SHIPROCKET_EMAIL: ${{ secrets.SHIPROCKET_EMAIL }}
          SHIPROCKET_PASSWORD: ${{ secrets.SHIPROCKET_PASSWORD }}
          SHIPROCKET_PICKUP_LOCATION: ${{ secrets.SHIPROCKET_PICKUP_LOCATION }}
          SHIPROCKET_WEBHOOK_SECRET: ${{ secrets.SHIPROCKET_WEBHOOK_SECRET }}
        run: |
          python3 - << 'PY'
          import os

          env_file_secret = os.environ.get("ENV_FILE_SECRET", "").strip()
          if env_file_secret:
              print("==> Using full ENV_FILE from GitHub Secrets")
              with open(".env", "w") as f:
                  f.write(env_file_secret + "\n")
          else:
              print("==> Constructing .env from individual GitHub Secrets")
              keys = [
                  "ENVIRONMENT", "PORT", "FRONTEND_URL", "ALLOWED_ORIGINS",
                  "MONGO_URI", "JWT_SECRET",
                  "RAZORPAY_KEY_ID", "RAZORPAY_KEY_SECRET", "RAZORPAY_MODE",
                  "FIREBASE_PROJECT_ID", "FIREBASE_BUCKET_NAME", "FIREBASE_CREDENTIALS_JSON",
                  "DELHIVERY_API_TOKEN", "DELHIVERY_BASE_URL", "DELHIVERY_PICKUP_LOCATION",
                  "DELHIVERY_SELLER_NAME", "DELHIVERY_SELLER_PHONE", "DELHIVERY_SELLER_ADDRESS",
                  "DELHIVERY_SELLER_CITY", "DELHIVERY_SELLER_STATE", "DELHIVERY_SELLER_PINCODE",
                  "DELHIVERY_RETURN_ADDRESS", "DELHIVERY_RETURN_CITY", "DELHIVERY_RETURN_STATE",
                  "DELHIVERY_RETURN_PINCODE", "DELHIVERY_RETURN_PHONE",
                  "FLOWSELL_API_KEY", "FLOWSELL_API_BASE_URL",
                  "WHATSAPP_PHONE_NUMBER_ID", "WHATSAPP_WELCOME_TEMPLATE",
                  "WHATSAPP_CART_TEMPLATE", "WHATSAPP_WELCOME_IMAGE_URL",
                  "SHIPROCKET_EMAIL", "SHIPROCKET_PASSWORD",
                  "SHIPROCKET_PICKUP_LOCATION", "SHIPROCKET_WEBHOOK_SECRET"
              ]
              defaults = {
                  "ENVIRONMENT": "production",
                  "PORT": "8080",
                  "FRONTEND_URL": "https://makwatches.in",
                  "ALLOWED_ORIGINS": "https://makwatches.in,https://admin.makwatches.in",
                  "RAZORPAY_MODE": "live"
              }
              with open(".env", "w") as f:
                  for k in keys:
                      val = os.environ.get(k, defaults.get(k, ""))
                      f.write(f"{k}={val}\n")
          print("==> .env file generated successfully")
          PY

      - name: Build Lambda Packages
        run: |
          sudo apt-get update -qq && sudo apt-get install -y zip
          bash deploy/aws/build.sh

      - name: Deploy to AWS Lambda & API Gateway
        run: |
          bash deploy/aws/deploy.sh

      - name: Prune ECR Images (Keep Top 4 to Minimize Storage Cost)
        continue-on-error: true
        run: |
          python3 - << 'PY'
          import json, subprocess, sys

          region = "ap-south-1"
          repo_name = "makwatches-be"

          check = subprocess.run(
              ["aws", "ecr", "describe-repositories", "--repository-names", repo_name, "--region", region],
              capture_output=True, text=True
          )
          if check.returncode != 0:
              print(f"==> No ECR repository '{repo_name}' found (Lambda uses direct Graviton ARM64 zip packaging with 0 ECR cost).")
              sys.exit(0)

          print(f"==> Setting lifecycle policy on ECR repo {repo_name} to keep only top 4 images")
          policy = {
              "rules": [{
                  "rulePriority": 1,
                  "description": "Keep only latest 4 images",
                  "selection": {
                      "tagStatus": "any",
                      "countType": "imageCountMoreThan",
                      "countNumber": 4
                  },
                  "action": {"type": "expire"}
              }]
          }
          subprocess.run([
              "aws", "ecr", "put-lifecycle-policy",
              "--repository-name", repo_name,
              "--lifecycle-policy-text", json.dumps(policy),
              "--region", region
          ], check=False)

          out = subprocess.run([
              "aws", "ecr", "describe-images",
              "--repository-name", repo_name,
              "--region", region,
              "--query", "sort_by(imageDetails,&imagePushedAt)[::-1][4:].imageDigest",
              "--output", "text"
          ], capture_output=True, text=True)

          digests = out.stdout.strip().split()
          digests = [d for d in digests if d and d != "None"]
          if digests:
              print(f"==> Deleting {len(digests)} old ECR images beyond top 4...")
              for d in digests:
                  subprocess.run([
                      "aws", "ecr", "batch-delete-image",
                      "--repository-name", repo_name,
                      "--region", region,
                      "--image-ids", f"imageDigest={d}"
                  ], check=False)
          else:
              print("==> ECR images within limit (<= 4 images).")
          PY
